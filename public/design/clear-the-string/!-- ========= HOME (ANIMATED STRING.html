<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clear the String</title>

  <style>
    :root{
      --bg0:#0b1020;
      --bg1:#0f1830;
      --bg2:#070b14;

      --stroke:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.72);

      --accent:#2fd1ff;
      --accentGlow:rgba(47,209,255,.35);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: radial-gradient(1200px 900px at 50% 18%, var(--bg1) 0%, var(--bg0) 55%, var(--bg2) 100%);
      overflow-x:hidden;
    }

    /* =========================
       BACKGROUND: LETTER GRID
       - each square = one letter
       - filled row-wise from top-left to bottom-right
       ========================= */
    #bg-wordgrid{
      position:fixed;
      inset:0;
      z-index:-1;
      pointer-events:none;
      overflow:hidden;
    }

    #bg-wordgrid .grid{
      position:absolute;
      inset:0;
      display:grid;

      grid-template-columns: repeat(var(--bg-cols), var(--bg-cell));
      grid-template-rows: repeat(var(--bg-rows), var(--bg-cell));

      padding: 18px;
      gap: 6px;
      align-content:start;
    }

    #bg-wordgrid .cell{
      width: var(--bg-cell);
      height: var(--bg-cell);

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius: 8px;
      background: rgba(255,255,255,.012);
      border: 1px solid rgba(255,255,255,.025);

      overflow:hidden;
    }

    #bg-wordgrid .ch{
      font: 800 11px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      letter-spacing: 0;
      text-transform: uppercase;
      color: rgba(255,255,255,.055);
      text-shadow: 0 1px 0 rgba(0,0,0,.25);
      transform: translateY(0.5px);
      user-select:none;
    }

    @media (prefers-reduced-motion: reduce){
      #bg-wordgrid .ch{ transition:none; }
    }

    /* Layout */
    .wrap{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:56px 18px;
    }
    .panel{
      width:min(520px, 100%);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      text-align:center;
    }

    .logo{
      width:min(520px, 92%);
      height:auto;
      display:block;
      filter: drop-shadow(0 14px 34px rgba(0,0,0,.50));
      margin: 0 0 2px 0;
    }

    .string-wrap{
      width: min(520px, 92%);
      display:flex;
      justify-content:center;
      margin: 2px 0 6px 0;
    }
    .string-stage{
      width: 480px;
      max-width: 100%;
      height: 108px;
      border-radius:18px;
      border:1px solid rgba(47,209,255,.18);
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      box-shadow: 0 10px 26px rgba(0,0,0,.35);
      position:relative;
      overflow:hidden;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .string-stage:before{
      content:"";
      position:absolute;
      inset:-40px;
      background: radial-gradient(300px 140px at 50% 50%, rgba(47,209,255,.12), transparent 65%);
      opacity:.9;
      pointer-events:none;
    }

    .glyph{
      position:absolute;
      font: 800 12px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      color: rgba(47,209,255,.82);
      text-shadow: 0 0 16px var(--accentGlow);
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 250ms ease;
      user-select:none;
      pointer-events:none;
    }
    .glyph.on{ opacity: 1; }

    .tagline{
      margin:0 0 14px 0;
      color:var(--muted);
      font-weight:650;
      letter-spacing:.01em;
    }

    .card{
      width:min(520px, 92%);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--stroke);
      border-radius:18px;
      padding:14px;
      box-shadow:0 10px 26px rgba(0,0,0,.35);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      margin-top: 6px;
    }
    .daily-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .daily-left{ display:flex; flex-direction:column; align-items:flex-start; gap:8px; text-align:left; min-width:0; }
    .daily-meta{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
    .daily-label{ font-weight:800; letter-spacing:.03em; }
    .daily-date{ color:rgba(255,255,255,.68); font-weight:700; letter-spacing:.02em; }

    .dots{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .dot{ width:8px; height:8px; border-radius:999px; background:rgba(255,255,255,.22); box-shadow:0 0 0 1px rgba(255,255,255,.08) inset; }
    .dot.on{ background:var(--accent); box-shadow:0 0 16px rgba(47,209,255,.35); }

    .btn{
      appearance:none;
      border:1px solid rgba(47,209,255,.25);
      background:linear-gradient(180deg, rgba(47,209,255,.20), rgba(47,209,255,.12));
      color:var(--text);
      font-weight:800;
      letter-spacing:.02em;
      padding:10px 14px;
      border-radius:12px;
      cursor:pointer;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
      white-space:nowrap;
    }
    .btn:hover{
      transform: translateY(-1px);
      border-color: rgba(47,209,255,.45);
      background:linear-gradient(180deg, rgba(47,209,255,.26), rgba(47,209,255,.14));
    }
    .btn:active{ transform: translateY(0px); }

    .divider{
      width:140px; height:1px;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
      margin:12px 0 2px 0;
    }

    .list{
      width:100%;
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:6px;
      align-items:center;
    }
    .item{
      width:min(260px, 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid transparent;
      color:var(--text);
      text-decoration:none;
      background:transparent;
      transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
    }
    .item:hover{
      background:rgba(255,255,255,.04);
      border-color:rgba(255,255,255,.08);
      transform: translateY(-1px);
    }
    .ico{ width:18px; height:18px; color:rgba(255,255,255,.70); flex:0 0 auto; }
    .item span{ font-weight:750; letter-spacing:.01em; }
  </style>
</head>

<body>
  <div id="bg-wordgrid" aria-hidden="true"></div>

  <main class="wrap">
    <section class="panel" aria-label="Clear the String home">
      <img class="logo" src="./game%20logo.png" alt="Clear the String logo" />

      <div class="string-wrap" aria-hidden="true">
        <div class="string-stage" id="stringStage"></div>
      </div>

      <p class="tagline">One string. One solution. Every day.</p>

      <div class="card" role="region" aria-label="Daily puzzle">
        <div class="daily-row">
          <div class="daily-left">
            <div class="daily-meta">
              <div class="daily-label">Daily puzzle</div>
              <div class="daily-date" id="dailyDate">—</div>
            </div>
            <div class="dots" aria-label="Hidden words">
              <div class="dot on"></div><div class="dot on"></div><div class="dot on"></div><div class="dot on"></div>
              <div class="dot on"></div><div class="dot on"></div><div class="dot on"></div>
            </div>
          </div>
          <button class="btn" type="button" onclick="location.href='./game.html'">Play</button>
        </div>
      </div>

      <div class="divider" aria-hidden="true"></div>

      <nav class="list" aria-label="Menu">
        <a class="item" href="./previous.html">
          <svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M8 7V3m8 4V3M4 11h16M6 21h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span>Previous puzzles</span>
        </a>

        <a class="item" href="./how-to-play.html">
          <svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 18h.01M10.5 8.5a2.5 2.5 0 1 1 3.7 2.2c-.9.5-1.2 1-1.2 2.3v.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M12 22C6.5 22 2 17.5 2 12S6.5 2 12 2s10 4.5 10 10-4.5 10-10 10Z" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          <span>How to play</span>
        </a>

        <a class="item" href="./about.html">
          <svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 16v-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M12 8h.01" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
            <path d="M12 22C6.5 22 2 17.5 2 12S6.5 2 12 2s10 4.5 10 10-4.5 10-10 10Z" stroke="currentColor" stroke-width="1.8"/>
          </svg>
          <span>About</span>
        </a>

        <a class="item" href="./feedback.html">
          <svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
          <span>Feedback</span>
        </a>

        <a class="item" href="./language.html">
          <svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 5h7m-3 0v3m0 0h3m-3 0H6m12 13-3-7-3 7m1-2h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M14 5c0 6-3 10-8 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span>Language</span>
        </a>
      </nav>
    </section>
  </main>

  <script>
    (function setDate(){
      const el = document.getElementById("dailyDate");
      const d = new Date();
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const dd = String(d.getDate()).padStart(2,"0");
      const yyyy = d.getFullYear();
      el.textContent = `${mm}/${dd}/${yyyy}`;
    })();

    /* =========================
       BACKGROUND LETTER GRID
       - build a long string of ALL UI words, no mixing
       - fill cells row-wise, top-left to bottom-right
       ========================= */
    (function backgroundLetterGrid(){
      const root = document.getElementById("bg-wordgrid");

      const WORDS = [
        "CLEAR THE STRING",
        "ONE STRING",
        "ONE SOLUTION",
        "EVERY DAY",
        "DAILY PUZZLE",
        "PLAY",
        "PREVIOUS PUZZLES",
        "HOW TO PLAY",
        "ABOUT",
        "FEEDBACK",
        "LANGUAGE",
        "HINT",
        "RESET",
        "SUBMIT",
        "HIDDEN WORDS",
        "FOUND WORDS",
        "SELECT LETTERS",
        "CLEAR",
        "EASY",
        "MEDIUM",
        "HARD"
      ];

      // Smaller cells = more squares (your "double the squares" request)
      const CELL = 38;   // try 34 if you want even denser
      const GAP  = 6;
      const PAD  = 18;

      function makeStream(){
        // Join in order, keep spaces as real characters (they render as blanks)
        // Add separators so words don't smash together.
        const joined = WORDS.join("   ");
        return joined.toUpperCase();
      }

      function build(){
        root.innerHTML = "";

        const grid = document.createElement("div");
        grid.className = "grid";
        root.appendChild(grid);

        const w = window.innerWidth;
        const h = window.innerHeight;

        const availW = Math.max(0, w - PAD*2);
        const availH = Math.max(0, h - PAD*2);

        const cols = Math.max(1, Math.floor((availW + GAP) / (CELL + GAP)));
        const rows = Math.max(1, Math.floor((availH + GAP) / (CELL + GAP)));
        const total = cols * rows;

        grid.style.setProperty("--bg-cell", CELL + "px");
        grid.style.setProperty("--bg-cols", cols);
        grid.style.setProperty("--bg-rows", rows);

        const stream = makeStream();
        const len = stream.length;

        const frag = document.createDocumentFragment();
        for(let i=0;i<total;i++){
          const cell = document.createElement("div");
          cell.className = "cell";

          const span = document.createElement("span");
          span.className = "ch";

          const ch = stream[i % len];
          span.textContent = ch === " " ? "" : ch; // spaces = blank squares

          cell.appendChild(span);
          frag.appendChild(cell);
        }

        grid.appendChild(frag);
      }

      build();

      let t;
      window.addEventListener("resize", () => {
        clearTimeout(t);
        t = setTimeout(build, 150);
      });
    })();

    (function stringAnimation(){
      const stage = document.getElementById("stringStage");
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const HOLD_BEFORE_START_MS = 900;
      const SWIRL_DURATION_MS = 1400;
      const HOLD_COIL_MS = 450;
      const RETURN_DURATION_MS = 950;
      const MORPH_SWAP_MS = 120;

      const startStr = "SRTGNEHTCAELI".split("");
      const endStr = "CLEARTHESTRING".split("");
      const n = Math.max(startStr.length, endStr.length);

      const glyphs = [];
      for(let i=0;i<n;i++){
        const el = document.createElement("div");
        el.className = "glyph on";
        el.textContent = startStr[i] ?? "";
        stage.appendChild(el);
        glyphs.push(el);
      }

      const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
      const lerp = (a,b,t) => a + (b-a)*t;

      function linePositions(count){
        const r = stage.getBoundingClientRect();
        const cx = r.width / 2;
        const cy = r.height / 2;
        const step = 18;
        const total = (count - 1) * step;
        const startX = cx - total / 2;
        return Array.from({length: count}, (_, i) => [startX + i*step, cy]);
      }

      function spiralPoints(width, height, step){
        const pts = [];
        let left = 28, top = 20;
        let right = width - 28, bottom = height - 20;

        while(left < right && top < bottom){
          for(let x = left; x <= right; x += step) pts.push([x, top]);
          for(let y = top + step; y <= bottom; y += step) pts.push([right, y]);
          for(let x = right - step; x >= left; x -= step) pts.push([x, bottom]);
          for(let y = bottom - step; y >= top + step; y -= step) pts.push([left, y]);
          left += step*2; top += step*2; right -= step*2; bottom -= step*2;
        }
        return pts;
      }

      function coilPositions(count){
        const r = stage.getBoundingClientRect();
        const pts = spiralPoints(r.width, r.height, 12);
        return Array.from({length: count}, (_, i) =>
          pts[Math.min(pts.length-1, Math.floor(i * (pts.length / count)))]
        );
      }

      function setPositions(pos, rot=0){
        for(let i=0;i<glyphs.length;i++){
          const p = pos[i] || pos[pos.length-1];
          glyphs[i].style.left = p[0] + "px";
          glyphs[i].style.top = p[1] + "px";
          glyphs[i].style.transform = `translate(-50%,-50%) rotate(${rot}deg)`;
          glyphs[i].style.opacity = "1";
        }
      }

      function tween(fromPos, toPos, ms, spin){
        return new Promise((resolve) => {
          const start = performance.now();
          function frame(now){
            const t = Math.min(1, (now - start) / ms);
            const e = easeOutCubic(t);

            for(let i=0;i<glyphs.length;i++){
              const fp = fromPos[i] || fromPos[fromPos.length-1];
              const tp = toPos[i] || toPos[toPos.length-1];

              const x = lerp(fp[0], tp[0], e);
              const y = lerp(fp[1], tp[1], e);

              const rot = spin ? lerp(140 + i*8, 0, e) : 0;

              glyphs[i].style.left = x + "px";
              glyphs[i].style.top = y + "px";
              glyphs[i].style.transform = `translate(-50%,-50%) rotate(${rot}deg)`;
            }

            if(t < 1 && !reduce) requestAnimationFrame(frame);
            else resolve();
          }
          if(reduce){ resolve(); return; }
          requestAnimationFrame(frame);
        });
      }

      async function run(){
        const lineStart = linePositions(n);
        setPositions(lineStart, 0);

        glyphs[n-1].style.opacity = "0";
        glyphs[n-1].textContent = "";

        await new Promise(r => setTimeout(r, HOLD_BEFORE_START_MS));

        const coil = coilPositions(n);
        glyphs[n-1].style.opacity = "1";
        await tween(lineStart, coil, SWIRL_DURATION_MS, true);

        await new Promise(r => setTimeout(r, HOLD_COIL_MS));
        await new Promise(r => setTimeout(r, MORPH_SWAP_MS));

        for(let i=0;i<n;i++) glyphs[i].textContent = endStr[i] ?? "";

        const lineEnd = linePositions(n);
        await tween(coil, lineEnd, RETURN_DURATION_MS, false);
      }

      let resizeT;
      window.addEventListener("resize", () => {
        clearTimeout(resizeT);
        resizeT = setTimeout(() => { run(); }, 220);
      });

      run();
    })();
  </script>
</body>
</html>
